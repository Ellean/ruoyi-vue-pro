services:
  app:
    image: ghcr.io/ellean/ruoyi-vue-pro:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-star-ecom-erp-api}
    # CI 绑定 Docker 默认网桥地址，供前端 host.docker.internal 访问，而不是监听所有接口。
    ports:
      - '${HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-8022}:${SERVER_PORT:-48080}'
    restart: unless-stopped
    pull_policy: always
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - app-logs:/data/logs
      - app-uploads:/data/xq-erp/uploads

volumes:
  app-logs:
  app-uploads:
