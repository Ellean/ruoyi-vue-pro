name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai
  # GHCR 镜像名强制全小写，与 owner 的大小写无关
  IMAGE: ghcr.io/ellean/ruoyi-vue-pro

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 新提交只能取消 PR 检查，不能中断正在变更容器的部署。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 三腿并行，任一失败即由 ci-ok 给出显式红叉。
    # fail-fast 首次打通期曾设为 false，好让三腿各自独立报完（否则 Test 一红就把
    # Docker Build 取消掉，无从判断镜像能否构建）；全链路已绿，改回 true 省算力。
    strategy:
      fail-fast: true
      matrix:
        include:
          # 仓库无 spotless/checkstyle/pmd/spotbugs，文档模板的 lint 腿无从跑起；
          # 改为 Build 腿：runner 侧编译反馈远快于 Docker 腿，能提前暴露编译错误
          - name: Build
          - name: Test
          - name: Docker Build
    # 本 job 不进入任何 environment：镜像无 build args，部署链路的 secrets 仅 deploy 使用
    # Docker Build 写 GHCR buildcache 需要 packages:write；Build/Test 不使用该权限
    permissions:
      contents: read
      packages: write
    steps:
      # 浅克隆：仓库 pack 已 208MB，Build/Test 腿此前用 fetch-depth 0 拉全量历史纯属浪费。
      # 全仓无 git-commit-id / buildnumber 这类需要历史信息的插件，三腿统一浅克隆是安全的。
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # JDK 锁 25：根 pom 是 <java.version>25</java.version> + Spring Boot 4.1.0，
      # 旧 maven.yml 的 8/11/17 矩阵在此项目上必然编译失败
      - name: Setup Java
        if: ${{ matrix.name != 'Docker Build' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 硬编码凭据闸门：application.yaml 是所有 profile 的基线（prod 也加载），且四份 yaml 都会
      # 被打进 jar，而镜像是公开可匿名拉取的 —— 写进 yaml 的真值等于发布到公网。
      # 规则与例外清单见 docs/本地开发密钥存放规范.md §8。
      - name: No hardcoded credentials
        if: ${{ matrix.name == 'Build' }}
        run: |
          set -euo pipefail
          FILES="yudao-server/src/main/resources/application.yaml
          yudao-server/src/main/resources/application-prod.yaml"
          # shellcheck disable=SC2086
          HITS=$(grep -nE '(password|secret|api-key|access-key[a-z-]*|token):' $FILES \
            | grep -v '\${' \
            | grep -v 'cb022f1e-48f1-4c4a-a723-9001ac9676b8' || true)
          if [ -n "$HITS" ]; then
            echo "::error::发现非占位符的凭据，改成 \${ENV_VAR:} 形式（规范见 docs/本地开发密钥存放规范.md）"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no hardcoded credentials in $FILES"

      # -s .mvn/settings-ci.xml：把根 pom 为国内开发声明的 huaweicloud / aliyunmaven 镜像
      # 改指 Maven Central。runner 在美国，此前 90% 的依赖下载跨太平洋，冷缓存时 go-offline
      # 单项就要 20 分钟。详见该文件头部注释。
      - name: Build
        if: ${{ matrix.name == 'Build' }}
        run: ./mvnw -B -s .mvn/settings-ci.xml -DskipTests package

      # 测试栈是 H2 + jedis-mock + podam，纯内存，不需要外部 MySQL/Redis 服务
      - name: Test
        if: ${{ matrix.name == 'Test' }}
        run: ./mvnw -B -s .mvn/settings-ci.xml test

      - name: Verify deployment stack
        if: ${{ matrix.name == 'Test' }}
        run: python3 script/test_deploy.py

      - name: Compose image tags
        if: ${{ matrix.name == 'Docker Build' }}
        id: meta
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # PR 的 ref_name 形如 10/merge，含 '/' 非法，需 sanitize（本 job 不推送，tag 仅作校验）
          REF_TAG="${REF//\//-}"
          TAGS="${IMAGE}:${REF_TAG}
          ${IMAGE}:${SHA}"
          if [ "${REF}" = "main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo 'tags<<__TAGS_EOF__'
            echo "$TAGS"
            echo '__TAGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: ${{ matrix.name == 'Docker Build' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ matrix.name == 'Docker Build' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只构建不推送；层写入 GHCR buildcache 供 push-image 复用。
      # 缓存走 registry 而非 gha：gha cache 按 branch ACL 隔离，PR 的缓存落在
      # refs/pull/N/merge，对 dev/test 不可见，永远无法为分支构建预热。
      - name: Build image
        if: ${{ matrix.name == 'Docker Build' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          tags: ${{ steps.meta.outputs.tags }}

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [checks]
    # 上游失败仍执行判定，输出显式红叉；整跑被取消时跳过，防止取消态被判为通过
    if: ${{ !cancelled() }}
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: Check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi

  push-image:
    name: Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: ci-ok
    # CI 全绿才推送；PR 事件产物不进 registry
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compose image tags
        id: meta
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # dispatch 选中带 '/' 的分支时兜底（push 事件仅 main/test/dev）
          REF_TAG="${REF//\//-}"
          TAGS="${IMAGE}:${REF_TAG}
          ${IMAGE}:${SHA}"
          if [ "${REF}" = "main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo 'tags<<__TAGS_EOF__'
            echo "$TAGS"
            echo '__TAGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 缓存由同 run 的 Docker Build 腿写入 GHCR buildcache（mode=max），此处只读不写，仅组装+推送
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: push-image
    if: ${{ github.event_name != 'pull_request' && github.ref_type == 'branch' && contains(fromJSON('["main", "test", "dev"]'), github.ref_name) }}
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve deploy target
        id: target
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER }}
          BASE_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${HOST:?DEPLOY_HOST is required}"
          : "${SSH_USER:?DEPLOY_USER is required}"
          : "${BASE_PATH:?DEPLOY_PATH is required}"
          [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ "$BASE_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$BASE_PATH" != *'/../'* && "$BASE_PATH" != */.. ]] || exit 1
          case "$GITHUB_REF_NAME" in
            main) PORT=8020; NAME=star-ecom-erp-api ;;
            test) PORT=8021; NAME=star-ecom-erp-api-test ;;
            dev)  PORT=8022; NAME=star-ecom-erp-api-dev ;;
            *) exit 1 ;;
          esac
          {
            echo "host=$HOST"
            echo "user=$SSH_USER"
            echo "dir=${BASE_PATH%/}/$GITHUB_REF_NAME"
            echo "port=$PORT"
            echo "name=$NAME"
            echo "project=star-ecom-erp-api-$GITHUB_REF_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Render runtime .env
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          PROJECT: ${{ steps.target.outputs.project }}
          TAG: ${{ github.sha }}
          HOST_PORT: ${{ steps.target.outputs.port }}
          NAME: ${{ steps.target.outputs.name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          def fail(message):
              pathlib.Path('.env.deploy').unlink(missing_ok=True)
              sys.exit('::error::' + message)

          content = os.environ.get('APP_ENV', '')
          if not content.strip():
              fail('Environment secret APP_ENV is required; see docs/部署.md')
          allowed = set(re.findall(r'^#?\s*([A-Z][A-Z0-9_]*)=', pathlib.Path('.env.example').read_text(), re.M))
          allowed.add('JAVA_OPTS')
          seen = set()
          for number, line in enumerate(content.splitlines(), 1):
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              match = re.fullmatch(r'([A-Z][A-Z0-9_]*)=(.*)', line)
              if not match:
                  fail(f'APP_ENV line {number}: expected a single-line KEY=VALUE')
              key, value = match.groups()
              if key not in allowed or key in seen:
                  fail(f'APP_ENV line {number}: unknown, reserved or duplicate key')
              seen.add(key)
              if '$' in value and not (value.startswith("'") and value.endswith("'")):
                  fail(f'APP_ENV line {number}: values containing $ must be single-quoted')

          os.umask(0o077)
          topology = {'COMPOSE_PROJECT_NAME': os.environ['PROJECT'], 'IMAGE_TAG': os.environ['TAG'],
                      'HOST_PORT': os.environ['HOST_PORT'], 'CONTAINER_NAME': os.environ['NAME']}
          pathlib.Path('.env.deploy').write_text(''.join(f'{k}={v}\n' for k, v in topology.items()) + content + '\n')
          parsed = subprocess.run(
              ['docker', 'compose', '--env-file', '.env.deploy', '-f', 'docker-compose.yml', 'config', '--format', 'json'],
              env={**os.environ, 'APP_ENV_FILE': '.env.deploy'}, capture_output=True, text=True)
          if parsed.returncode or parsed.stderr:
              fail('APP_ENV cannot be parsed without warnings; values and parser output are withheld')
          # Compose config 会把字面量 $ 序列化成 $$，校验与掩码必须使用容器收到的原值。
          runtime = {key: value.replace('$$', '$') for key, value in
                     json.loads(parsed.stdout)['services']['app']['environment'].items()}
          for key in ('MASTER_DATASOURCE_USERNAME', 'MASTER_DATASOURCE_PASSWORD', 'REDIS_PASSWORD', 'MYBATIS_ENCRYPTOR_PASSWORD'):
              if not (runtime.get(key) or '').strip():
                  fail(f'APP_ENV requires a nonempty {key}')
          if runtime.get('REDIS_HOST') != 'redis':
              fail('REDIS_HOST must be redis for the Compose-managed service')
          if not (runtime.get('MYSQL_HOST') or runtime.get('MASTER_DATASOURCE_URL') or '').strip():
              fail('APP_ENV requires MYSQL_HOST or MASTER_DATASOURCE_URL')
          if len(runtime['MYBATIS_ENCRYPTOR_PASSWORD'].encode()) not in (16, 24, 32):
              fail('MYBATIS_ENCRYPTOR_PASSWORD must contain 16, 24 or 32 UTF-8 bytes')
          for key, default in (('SERVER_PORT', '48080'), ('REDIS_PORT', '6379')):
              port = runtime.get(key, default)
              if not re.fullmatch(r'[0-9]+', port) or not 1 <= int(port) <= 65535:
                  fail(f'{key} must be between 1 and 65535')
          database = runtime.get('REDIS_DATABASE', '0')
          if not re.fullmatch(r'[0-9]+', database) or not 0 <= int(database) < 16:
              fail('REDIS_DATABASE must be between 0 and 15')
          for value in runtime.values():
              if value:
                  escaped = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::add-mask::' + escaped)
          print('APP_ENV validated; values are not logged')
          PY

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions-xq

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?DEPLOY_SSH_KEY is required}"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy and verify over SSH
        env:
          HOST: ${{ steps.target.outputs.host }}
          SSH_USER: ${{ steps.target.outputs.user }}
          DIR: ${{ steps.target.outputs.dir }}
          TAG: ${{ github.sha }}
          HOST_PORT: ${{ steps.target.outputs.port }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10)
          TARGET="${SSH_USER}@${HOST}"
          BIND_IP=$(ssh "${SSH_OPTS[@]}" "$TARGET" "docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}'")
          BIND_IP="$BIND_IP" python3 - <<'PY'
          import ipaddress, os
          ip = ipaddress.IPv4Address(os.environ['BIND_IP'])
          if not ip.is_private or ip.is_unspecified or ip.is_loopback or ip.is_link_local:
              raise SystemExit('Docker bridge must have a private IPv4 gateway')
          PY
          printf 'HOST_BIND_IP=%s\n' "$BIND_IP" >> .env.deploy
          STAGE=$(ssh "${SSH_OPTS[@]}" "$TARGET" "umask 077; mkdir -p '$DIR' && mktemp -d '$DIR/.deploy.XXXXXXXX'")
          [[ "$STAGE" == "$DIR"/.deploy.* && "$STAGE" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          scp "${SSH_OPTS[@]}" docker-compose.yml .env.deploy "$TARGET:$STAGE/"
          ssh "${SSH_OPTS[@]}" "$TARGET" "bash -s -- '$DIR' '$STAGE' '$TAG' '$HOST_PORT' '$BIND_IP'" <<'REMOTE'
          set -euo pipefail
          umask 077
          dir=$1; stage=$2; tag=$3; port=$4; bind_ip=$5
          trap 'rm -f "$stage/.env.deploy" "$stage/docker-compose.yml" "$stage/health.json"; rmdir "$stage"' EXIT
          exec 9>"$dir/.deploy.lock"
          flock -w 600 9
          export APP_ENV_FILE="$stage/.env.deploy"
          compose=(docker compose --project-directory "$dir" --env-file "$stage/.env.deploy" -f "$stage/docker-compose.yml")
          if ! "${compose[@]}" config --quiet > /dev/null 2>&1; then
            echo '::error::Remote Compose validation failed; inspect configuration locally on the host'
            exit 1
          fi
          if ! "${compose[@]}" pull --quiet app redis > /dev/null 2>&1; then
            echo '::error::Image pull failed; existing deployment has not been changed'
            exit 1
          fi
          expected=$(docker image inspect "ghcr.io/ellean/ruoyi-vue-pro:$tag" --format '{{.Id}}')
          expected_redis=$(docker image inspect "$("${compose[@]}" config --images redis)" --format '{{.Id}}')
          if ! "${compose[@]}" up -d --pull never --wait --wait-timeout 300 app redis > /dev/null 2>&1; then
            echo '::error::App or Redis failed to become healthy; inspect service logs on the host and roll back if needed'
            exit 1
          fi
          cid=$("${compose[@]}" ps -q app)
          [[ -n "$cid" && "$(docker inspect --format '{{.Image}}' "$cid")" == "$expected" ]]
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$cid")" == healthy ]]
          redis_cid=$("${compose[@]}" ps -q redis)
          [[ -n "$redis_cid" && "$(docker inspect --format '{{.Image}}' "$redis_cid")" == "$expected_redis" ]]
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$redis_cid")" == healthy ]]
          code=$(curl -s --max-time 5 -o "$stage/health.json" -w '%{http_code}' "http://$bind_ip:$port/actuator/health")
          [[ "$code" == 200 ]]
          python3 -c 'import json,sys; sys.exit(json.load(open(sys.argv[1])).get("status") != "UP")' "$stage/health.json"
          mv "$stage/.env.deploy" "$dir/.env"
          mv "$stage/docker-compose.yml" "$dir/docker-compose.yml"
          echo 'Deployment verified: expected image, healthy container and HTTP 200/UP'
          REMOTE

      - name: Clean runner credentials
        if: ${{ always() }}
        run: rm -f .env.deploy ~/.ssh/deploy_key

  notify:
    name: WeCom Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-ok, push-image, deploy]
    # PR 运行（止于 ci-ok）推 PR 群，push/手动触发推 Actions 群；
    # 上游失败或被跳过仍要通知（否则 PR 运行永不发送）；整跑被并发取消时静默，由后继运行补发
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
      # 消息标题自报端别：与前端仓库共用企微群时靠它区分来源
      APP_SIDE: 后端
    steps:
      - name: Send WeCom notification
        env:
          GH_TOKEN: ${{ github.token }}
          WECOM_PR_WEBHOOK: ${{ secrets.WECOM_PR_WEBHOOK }}
          WECOM_CI_WEBHOOK: ${{ secrets.WECOM_CI_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            WEBHOOK="$WECOM_PR_WEBHOOK"
          else
            WEBHOOK="$WECOM_CI_WEBHOOK"
          fi
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::WeCom webhook secret not configured, skip notification"
            exit 0
          fi

          # 失败 job 名单与整跑耗时；notify 自身仍在运行、skipped job 无时间戳，均需过滤 null
          JOBS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs')
          FAILED=$(jq -r '[.[] | select(.conclusion == "failure") | .name] | join("、")' <<<"$JOBS")
          START=$(jq -r '[.[].started_at | select(. != null)] | min' <<<"$JOBS")
          END=$(jq -r '[.[].completed_at | select(. != null)] | max' <<<"$JOBS")
          SECS=$(( $(date -u -d "$END" +%s) - $(date -u -d "$START" +%s) ))
          DUR="$(( SECS / 60 ))m$(( SECS % 60 ))s"

          if [ "$FAILURE" = "true" ]; then
            ICON="❌"; LABEL="失败"
          else
            ICON="✅"; LABEL="成功"
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEADLINE="${APP_SIDE} PR CI ${LABEL}"
            TITLE="**[#${PR_NUMBER} ${PR_TITLE}](${PR_URL})**"
            WHO="${PR_AUTHOR} · ${PR_HEAD} → ${PR_BASE}"
          else
            SUBJECT=$(printf '%s\n' "$HEAD_MSG" | head -1)
            if [ -z "$SUBJECT" ]; then
              SUBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.commit.message' | head -1)
            fi
            HEADLINE="${APP_SIDE} CI ${LABEL}"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              HEADLINE="${APP_SIDE} · 手动触发 CI ${LABEL}"
            fi
            TITLE="**${SUBJECT}**"
            WHO="${ACTOR} · ${REF_NAME} · ${SHA:0:8}"
          fi

          # 版式（仅用企微 markdown 支持的语法）：标题 / 关联对象 / 元信息（灰字引用块）/
          # 结果行（失败 job 橙字、部署成功绿字）/ 耗时与运行入口
          {
            echo "## ${ICON} ${HEADLINE}"
            echo ""
            echo "${TITLE}"
            echo ""
            echo "> <font color=\"comment\">👤 ${WHO}</font>"
            if [ -n "$FAILED" ]; then
              echo ""
              echo "⚠️ <font color=\"warning\">失败 job：${FAILED}</font>"
            fi
            if [ "$FAILURE" = "false" ] && [ "$DEPLOY_RESULT" = "success" ]; then
              echo ""
              echo "<font color=\"info\">已部署 ${REF_NAME} 环境（镜像与健康检查已验证）</font>"
            fi
            echo ""
            echo "⏱ 耗时 ${DUR} · [查看运行](${RUN_URL})"
          } > /tmp/wecom-msg.md

          PAYLOAD=$(jq -Rs '{msgtype: "markdown", markdown: {content: .}}' /tmp/wecom-msg.md)
          RESP=$(curl -fsS -m 10 --retry 2 --retry-delay 2 -X POST \
            -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK")
          echo "$RESP" | jq -e '.errcode == 0' > /dev/null
          echo "WeCom notified: ${RESP}"
