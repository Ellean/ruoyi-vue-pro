name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai
  # GHCR 镜像名强制全小写，与 owner 的大小写无关
  IMAGE: ghcr.io/ellean/ruoyi-vue-pro

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 三腿并行，任一失败即由 ci-ok 给出显式红叉。
    # fail-fast 首次打通期曾设为 false，好让三腿各自独立报完（否则 Test 一红就把
    # Docker Build 取消掉，无从判断镜像能否构建）；全链路已绿，改回 true 省算力。
    strategy:
      fail-fast: true
      matrix:
        include:
          # 仓库无 spotless/checkstyle/pmd/spotbugs，文档模板的 lint 腿无从跑起；
          # 改为 Build 腿：runner 侧编译反馈远快于 Docker 腿，能提前暴露编译错误
          - name: Build
          - name: Test
          - name: Docker Build
    # 本 job 不进入任何 environment：镜像无 build args，部署链路的 secrets 仅 deploy 使用
    # Docker Build 写 GHCR buildcache 需要 packages:write；Build/Test 不使用该权限
    permissions:
      contents: read
      packages: write
    steps:
      # 浅克隆：仓库 pack 已 208MB，Build/Test 腿此前用 fetch-depth 0 拉全量历史纯属浪费。
      # 全仓无 git-commit-id / buildnumber 这类需要历史信息的插件，三腿统一浅克隆是安全的。
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # JDK 锁 25：根 pom 是 <java.version>25</java.version> + Spring Boot 4.1.0，
      # 旧 maven.yml 的 8/11/17 矩阵在此项目上必然编译失败
      - name: Setup Java
        if: ${{ matrix.name != 'Docker Build' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 硬编码凭据闸门：application.yaml 是所有 profile 的基线（prod 也加载），且四份 yaml 都会
      # 被打进 jar，而镜像是公开可匿名拉取的 —— 写进 yaml 的真值等于发布到公网。
      # 规则与例外清单见 docs/本地开发密钥存放规范.md §8。
      - name: No hardcoded credentials
        if: ${{ matrix.name == 'Build' }}
        run: |
          set -euo pipefail
          FILES="yudao-server/src/main/resources/application.yaml
          yudao-server/src/main/resources/application-prod.yaml"
          # shellcheck disable=SC2086
          HITS=$(grep -nE '(password|secret|api-key|access-key[a-z-]*|token):' $FILES \
            | grep -v '\${' \
            | grep -v 'cb022f1e-48f1-4c4a-a723-9001ac9676b8' || true)
          if [ -n "$HITS" ]; then
            echo "::error::发现非占位符的凭据，改成 \${ENV_VAR:} 形式（规范见 docs/本地开发密钥存放规范.md）"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no hardcoded credentials in $FILES"

      # -s .mvn/settings-ci.xml：把根 pom 为国内开发声明的 huaweicloud / aliyunmaven 镜像
      # 改指 Maven Central。runner 在美国，此前 90% 的依赖下载跨太平洋，冷缓存时 go-offline
      # 单项就要 20 分钟。详见该文件头部注释。
      - name: Build
        if: ${{ matrix.name == 'Build' }}
        run: ./mvnw -B -s .mvn/settings-ci.xml -DskipTests package

      # 测试栈是 H2 + jedis-mock + podam，纯内存，不需要外部 MySQL/Redis 服务
      - name: Test
        if: ${{ matrix.name == 'Test' }}
        run: ./mvnw -B -s .mvn/settings-ci.xml test

      - name: Compose image tags
        if: ${{ matrix.name == 'Docker Build' }}
        id: meta
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # PR 的 ref_name 形如 10/merge，含 '/' 非法，需 sanitize（本 job 不推送，tag 仅作校验）
          REF_TAG="${REF//\//-}"
          TAGS="${IMAGE}:${REF_TAG}
          ${IMAGE}:${SHA}"
          if [ "${REF}" = "main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo 'tags<<__TAGS_EOF__'
            echo "$TAGS"
            echo '__TAGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: ${{ matrix.name == 'Docker Build' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ matrix.name == 'Docker Build' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只构建不推送；层写入 GHCR buildcache 供 push-image 复用。
      # 缓存走 registry 而非 gha：gha cache 按 branch ACL 隔离，PR 的缓存落在
      # refs/pull/N/merge，对 dev/test 不可见，永远无法为分支构建预热。
      - name: Build image
        if: ${{ matrix.name == 'Docker Build' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          tags: ${{ steps.meta.outputs.tags }}

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [checks]
    # 上游失败仍执行判定，输出显式红叉；整跑被取消时跳过，防止取消态被判为通过
    if: ${{ !cancelled() }}
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: Check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi

  push-image:
    name: Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: ci-ok
    # CI 全绿才推送；PR 事件产物不进 registry
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compose image tags
        id: meta
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # dispatch 选中带 '/' 的分支时兜底（push 事件仅 main/test/dev）
          REF_TAG="${REF//\//-}"
          TAGS="${IMAGE}:${REF_TAG}
          ${IMAGE}:${SHA}"
          if [ "${REF}" = "main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo 'tags<<__TAGS_EOF__'
            echo "$TAGS"
            echo '__TAGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 缓存由同 run 的 Docker Build 腿写入 GHCR buildcache（mode=max），此处只读不写，仅组装+推送
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # 30 分钟：首次要经 tailnet 拉镜像（实测 :dev 压缩后 511MB，其中一层就占 386MB），
    # 冷启动本身又要 2 分钟上下（见 Verify 步）
    timeout-minutes: 30
    needs: push-image
    # push 仅 main/test/dev 触发；dispatch 选到其他分支时跳过部署（PR 经 needs 自动跳过）
    if: ${{ contains(fromJSON('["main", "test", "dev"]'), github.ref_name) }}
    # 按分支挂接同名 Environment：APP_ENV 由此按环境解析；PR 运行不挂环境，拿不到部署密钥
    environment: ${{ github.ref_name }}
    # health_url 供 notify 在部署成功时展示环境探活地址（deploy 被跳过时为空）
    outputs:
      health_url: ${{ steps.target.outputs.health_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ephemeral 节点，job 结束自动离网；tag 与前端仓库共用，ACL 里已存在
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions-xq

      - name: Resolve deploy target
        id: target
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER }}
          BASE_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # 缺配置直接报错中止，避免静默跳过部署
          : "${HOST:?repository variable DEPLOY_HOST is required}"
          : "${SSH_USER:?repository variable DEPLOY_USER is required}"
          BASE_PATH="${BASE_PATH:-/home/edward/star-ecom-erp-api}"
          case "${GITHUB_REF_NAME}" in
            # 宿主机端口段避开前端的 8010-8012；容器内端口由 APP_ENV 的 SERVER_PORT 决定，
            # 默认 48080，compose 的映射跟着它走，见 docker-compose.yml
            main) PORT=8020; NAME=star-ecom-erp-api ;;
            test) PORT=8021; NAME=star-ecom-erp-api-test ;;
            dev)  PORT=8022; NAME=star-ecom-erp-api-dev ;;
            *)    echo "::error::未映射的分支 ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          {
            echo "host=$HOST"
            echo "user=$SSH_USER"
            echo "dir=${BASE_PATH}/${GITHUB_REF_NAME}"
            echo "port=$PORT"
            echo "name=$NAME"
            echo "project=star-ecom-erp-api-${GITHUB_REF_NAME}"
            echo "health_url=http://${HOST}:${PORT}/actuator/health"
          } >> "$GITHUB_OUTPUT"

      # APP_ENV 是整份填好真值的 .env.example（Environment secret，main/test/dev 各一份）。
      # 用一份 blob 而不是 60 个独立 secret：键名清单已经在仓库里（.env.example），拆成
      # 60 个 secret 只会让「模板加一个键」变成「三个环境各加一个 secret」的三倍工作量。
      # 代价是自由文本没法靠 GitHub 校验，所以下面自己校验形状与必填项。
      - name: Render runtime .env
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          PROJECT: ${{ steps.target.outputs.project }}
          # 用完整 sha 而不是分支名当 tag：分支 tag 是可变的，部署机上一次手动
          # docker compose pull 就会悄悄换成别的构建；sha tag 让 `cat .env` 直接说明线上跑的是哪次构建。
          # 回滚 = 把 IMAGE_TAG 改成历史 sha 再 up -d（push-image 同时推了分支 tag 与 sha tag）。
          TAG: ${{ github.sha }}
          HOST_PORT: ${{ steps.target.outputs.port }}
          NAME: ${{ steps.target.outputs.name }}
        run: |
          set -euo pipefail
          : "${APP_ENV:?environment secret APP_ENV is required —— 填一份 .env.example 的真值，见 docs/部署.md}"

          # 键名写错不会报错、只会静默回落到 yaml 默认值，所以先卡形状：
          # 非注释非空行必须是 KEY=VALUE
          BAD_SHAPE=$(printf '%s\n' "$APP_ENV" \
            | grep -vE '^[[:space:]]*(#|$)' \
            | grep -vE '^[A-Za-z_][A-Za-z0-9_]*=' || true)
          if [ -n "$BAD_SHAPE" ]; then
            echo "::error::APP_ENV 里有不是 KEY=VALUE 形状的行（只回显首个字段，值一律抹掉）"
            # 形状错的行往往正是「把 : 当成了 =」这类手误，整行回显等于把口令写进 CI 日志
            printf '%s\n' "$BAD_SHAPE" | awk '{print $1}' | sed -E 's/[=:].*/=<redacted>/'
            exit 1
          fi

          # 这四个键由 CI 按分支计算，被 APP_ENV 覆盖就会让三个环境的编排互相踩
          # （SERVER_PORT 不在其列：compose 的映射与镜像的 HEALTHCHECK 都跟着它走，改了不会失配）
          FORBIDDEN=$(printf '%s\n' "$APP_ENV" \
            | grep -oE '^(COMPOSE_PROJECT_NAME|IMAGE_TAG|HOST_PORT|CONTAINER_NAME)=' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::这些键不能写进 APP_ENV（由 CI / 镜像决定）：$(printf '%s' "$FORBIDDEN" | tr -d '=' | sort -u | tr '\n' ' ')"
            exit 1
          fi

          # 数据库与 Redis 缺了应用必然起不来；与其让容器反复重启，不如在这里就红掉
          for KEY in MYSQL_HOST MASTER_DATASOURCE_PASSWORD REDIS_HOST; do
            if ! printf '%s\n' "$APP_ENV" | grep -qE "^${KEY}=.+$"; then
              echo "::error::APP_ENV 缺少 ${KEY} 或其值为空（键名清单见 .env.example）"
              exit 1
            fi
          done

          {
            echo "# 由 CI 的 deploy job 生成；compose 文件与 .env 以仓库为唯一事实源，不要手改"
            echo "# 编排键按分支计算，其余运行期配置来自 Environment secret APP_ENV"
            echo "COMPOSE_PROJECT_NAME=${PROJECT}"
            echo "IMAGE_TAG=${TAG}"
            echo "HOST_PORT=${HOST_PORT}"
            echo "CONTAINER_NAME=${NAME}"
            printf '%s\n' "$APP_ENV"
          } > .env.deploy
          # 只报键数，不回显内容
          echo "rendered $(grep -cE '^[A-Za-z_]' .env.deploy) keys into .env.deploy"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          : "${SSH_KEY:?repository secret DEPLOY_SSH_KEY is required}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # 服务器上的 compose 文件与 .env 每次部署覆盖同步
      - name: Deploy over SSH
        env:
          HOST: ${{ steps.target.outputs.host }}
          SSH_USER: ${{ steps.target.outputs.user }}
          DIR: ${{ steps.target.outputs.dir }}
        run: |
          set -euo pipefail
          # tailnet 内是 WireGuard 加密链路，主机指纹首次信任（TOFU）
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          # 先把 .env 以 600 建出来：scp 覆盖已存在的文件时保留其权限位，于是凭据从落地那一刻
          # 起就是 600，不存在「先 644 躺一会儿再 chmod」的窗口
          ssh $SSH_OPTS "${SSH_USER}@${HOST}" \
            "mkdir -p '${DIR}' && touch '${DIR}/.env' && chmod 600 '${DIR}/.env'"
          scp $SSH_OPTS docker-compose.yml "${SSH_USER}@${HOST}:${DIR}/docker-compose.yml"
          scp $SSH_OPTS .env.deploy "${SSH_USER}@${HOST}:${DIR}/.env"
          rm -f .env.deploy
          # --remove-orphans 清掉改名后遗留的旧容器，避免它继续占着宿主机端口
          ssh $SSH_OPTS "${SSH_USER}@${HOST}" \
            "cd '${DIR}' \
             && docker compose pull --quiet \
             && docker compose up -d --remove-orphans \
             && docker compose ps \
             && docker image prune -f > /dev/null"

      # 直连自己端口探测，不经前端反代。/actuator/** 是 permitAll
      # （yudao-module-infra 的 SecurityConfiguration），无需带 token。
      # 5 分钟窗口：模块多 + quartz 集群 + AI 依赖，冷启动明显慢于普通 Spring Boot 应用，
      # Dockerfile 的 HEALTHCHECK start-period 同样给了 120s。
      - name: Verify over tailnet
        env:
          HEALTH_URL: ${{ steps.target.outputs.health_url }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "$HEALTH_URL" > /dev/null; then
              echo "OK: $HEALTH_URL is UP"
              exit 0
            fi
            echo "attempt $i/60 not ready, retrying in 5s..."
            sleep 5
          done
          echo "::error::health check failed: $HEALTH_URL 在 300s 内未 UP（docker compose logs app 看启动日志）"
          exit 1

  notify:
    name: WeCom Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-ok, push-image, deploy]
    # PR 运行（止于 ci-ok）推 PR 群，push/手动触发推 Actions 群；
    # 上游失败或被跳过仍要通知（否则 PR 运行永不发送）；整跑被并发取消时静默，由后继运行补发
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
      # 消息标题自报端别：与前端仓库共用企微群时靠它区分来源
      APP_SIDE: 后端
    steps:
      - name: Send WeCom notification
        env:
          GH_TOKEN: ${{ github.token }}
          WECOM_PR_WEBHOOK: ${{ secrets.WECOM_PR_WEBHOOK }}
          WECOM_CI_WEBHOOK: ${{ secrets.WECOM_CI_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          HEALTH_URL: ${{ needs.deploy.outputs.health_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            WEBHOOK="$WECOM_PR_WEBHOOK"
          else
            WEBHOOK="$WECOM_CI_WEBHOOK"
          fi
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::WeCom webhook secret not configured, skip notification"
            exit 0
          fi

          # 失败 job 名单与整跑耗时；notify 自身仍在运行、skipped job 无时间戳，均需过滤 null
          JOBS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs')
          FAILED=$(jq -r '[.[] | select(.conclusion == "failure") | .name] | join("、")' <<<"$JOBS")
          START=$(jq -r '[.[].started_at | select(. != null)] | min' <<<"$JOBS")
          END=$(jq -r '[.[].completed_at | select(. != null)] | max' <<<"$JOBS")
          SECS=$(( $(date -u -d "$END" +%s) - $(date -u -d "$START" +%s) ))
          DUR="$(( SECS / 60 ))m$(( SECS % 60 ))s"

          if [ "$FAILURE" = "true" ]; then
            ICON="❌"; LABEL="失败"
          else
            ICON="✅"; LABEL="成功"
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEADLINE="${APP_SIDE} PR CI ${LABEL}"
            TITLE="**[#${PR_NUMBER} ${PR_TITLE}](${PR_URL})**"
            WHO="${PR_AUTHOR} · ${PR_HEAD} → ${PR_BASE}"
          else
            SUBJECT=$(printf '%s\n' "$HEAD_MSG" | head -1)
            if [ -z "$SUBJECT" ]; then
              SUBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.commit.message' | head -1)
            fi
            HEADLINE="${APP_SIDE} CI ${LABEL}"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              HEADLINE="${APP_SIDE} · 手动触发 CI ${LABEL}"
            fi
            TITLE="**${SUBJECT}**"
            WHO="${ACTOR} · ${REF_NAME} · ${SHA:0:8}"
          fi

          # 版式（仅用企微 markdown 支持的语法）：标题 / 关联对象 / 元信息（灰字引用块）/
          # 结果行（失败 job 橙字、部署成功绿字）/ 耗时与运行入口
          {
            echo "## ${ICON} ${HEADLINE}"
            echo ""
            echo "${TITLE}"
            echo ""
            echo "> <font color=\"comment\">👤 ${WHO}</font>"
            if [ -n "$FAILED" ]; then
              echo ""
              echo "⚠️ <font color=\"warning\">失败 job：${FAILED}</font>"
            fi
            # 后端不开 Funnel（见 docker-compose.yml 注释），所以给的是 tailnet 内的探活地址，
            # 只有连上 tailnet 的人打得开；deploy 被跳过时 health_url 为空，本行自动不出现
            if [ "$FAILURE" = "false" ] && [ "$DEPLOY_RESULT" = "success" ] && [ -n "$HEALTH_URL" ]; then
              echo ""
              echo "🚀 <font color=\"info\">已部署 ${REF_NAME} 环境</font>　[探活](${HEALTH_URL})"
            fi
            echo ""
            echo "⏱ 耗时 ${DUR} · [查看运行](${RUN_URL})"
          } > /tmp/wecom-msg.md

          PAYLOAD=$(jq -Rs '{msgtype: "markdown", markdown: {content: .}}' /tmp/wecom-msg.md)
          RESP=$(curl -fsS -m 10 --retry 2 --retry-delay 2 -X POST \
            -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK")
          echo "$RESP" | jq -e '.errcode == 0' > /dev/null
          echo "WeCom notified: ${RESP}"
